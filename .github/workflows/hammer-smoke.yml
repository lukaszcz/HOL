name: hammer-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  smoke:
    # GitHub's hosted Ubuntu runner is the Phase 0 x86_64 Linux witness.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # hol-dev is built from develop and lags this checkout. Bump this
      # recorded tag deliberately when refreshing the built HOL baseline.
      image: binghelisp/hol-dev:ci-db751c2-stdknl
    env:
      HOL4_EPROVER_EXECUTABLE: >-
        /tmp/provers/e-3.2.5-ho/x86_64-linux/eprover
      HOL4_VAMPIRE_EXECUTABLE: >-
        /tmp/provers/vampire-5.0.1/x86_64-linux/vampire
      HOL4_ZIPPERPOSITION_EXECUTABLE: >-
        /tmp/provers/zipperposition-2.1-2/x86_64-linux/zipperposition

    steps:
      - name: Check out branch under test
        uses: actions/checkout@v5

      - name: Hash prover pin table
        id: p
        shell: sh
        run: |
          hash=$(sha256sum tools/download-provers)
          echo "h=${hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned provers
        uses: actions/cache@v4
        with:
          path: /tmp/provers
          # Pins are embedded in download-provers; their hash invalidates this.
          key: hp-${{runner.os}}-${{runner.arch}}-${{steps.p.outputs.h}}

      - name: Download pinned provers
        run: tools/download-provers --dest /tmp/provers

      - name: Rebuild HolyHammer against the pinned HOL
        shell: sh
        run: |
          # hhEval uses JSONPrinter, which this branch adds; the image's
          # sigobj predates it, so refresh the json library first.
          cp -a src/portableML/json/. /ML/HOL/src/portableML/json/
          cp -a src/AI/proof_search/. /ML/HOL/src/AI/proof_search/
          cp -a src/AI/machine_learning/. /ML/HOL/src/AI/machine_learning/
          cp -a src/holyhammer/. /ML/HOL/src/holyhammer/
          /ML/HOL/bin/Holmake -C /ML/HOL/src/portableML/json cleanAll
          /ML/HOL/bin/Holmake -C /ML/HOL/src/portableML/json
          /ML/HOL/bin/Holmake -C /ML/HOL/src/AI/proof_search cleanAll
          /ML/HOL/bin/Holmake -C /ML/HOL/src/AI/proof_search
          /ML/HOL/bin/Holmake -C /ML/HOL/src/AI/machine_learning cleanAll
          /ML/HOL/bin/Holmake -C /ML/HOL/src/AI/machine_learning
          /ML/HOL/bin/Holmake -C /ML/HOL/src/holyhammer cleanAll
          /ML/HOL/bin/Holmake -C /ML/HOL/src/holyhammer

      - name: Run hermetic and end-to-end tests
        working-directory: /ML/HOL/src/holyhammer
        run: |
          ./selftest.exe
          ./smoke.exe
